<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛孩預約 | 線上預約系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E7;
    --cream-2:#EFE7D8;
    --pine:#26433A;
    --pine-2:#345A4C;
    --sage:#8FB09C;
    --sage-light:#D9E6DC;
    --apricot:#E4943D;
    --apricot-dark:#C97A28;
    --blush:#EFB79D;
    --ink:#26241F;
    --ink-soft:#5B5647;
    --line:#DDD2BC;
    --white:#FFFDF9;
    --danger:#C15B4A;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(143,176,156,0.18) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(228,148,61,0.12) 0, transparent 45%);
    color:var(--ink);
    font-family:"Noto Sans TC", sans-serif;
    min-height:100vh;
    padding:32px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---------- Header ---------- */
  .brand{
    display:flex;align-items:center;gap:12px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:46px;height:46px;border-radius:14px;
    background:var(--pine);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(38,67,58,0.25);
  }
  .brand-name{
    font-family:"Noto Serif TC", serif;
    font-weight:900;
    font-size:22px;
    color:var(--pine);
    letter-spacing:0.5px;
    line-height:1.1;
  }
  .brand-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:1px;
    margin-top:2px;
  }

  /* ---------- Progress ---------- */
  .progress{
    display:flex;
    justify-content:space-between;
    margin-bottom:26px;
    position:relative;
    padding:0 4px;
  }
  .progress::before{
    content:"";
    position:absolute;
    top:16px;left:28px;right:28px;
    height:2px;
    background:var(--line);
    z-index:0;
  }
  .step-dot{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    gap:6px;
    cursor:default;
    flex:1;
  }
  .step-dot.clickable{cursor:pointer;}
  .step-num{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--white);
    border:2px solid var(--line);
    font-weight:700;font-size:13px;
    color:var(--ink-soft);
    transition:all .2s ease;
  }
  .step-dot.active .step-num{
    background:var(--apricot);border-color:var(--apricot-dark);color:#fff;
  }
  .step-dot.done .step-num{
    background:var(--pine);border-color:var(--pine);color:#fff;
  }
  .step-label{
    font-size:11.5px;color:var(--ink-soft);
    text-align:center;
    max-width:64px;
    line-height:1.3;
  }
  .step-dot.active .step-label{color:var(--pine);font-weight:700;}

  /* ---------- Bubble divider (signature element) ---------- */
  .bubbles{
    display:flex;align-items:flex-end;justify-content:center;
    gap:10px;height:20px;margin:18px 0 8px;opacity:.85;
  }
  .bubbles span{
    display:block;border-radius:50%;
    background:linear-gradient(160deg, var(--sage-light), var(--sage));
  }
  .bubbles span:nth-child(1){width:6px;height:6px;}
  .bubbles span:nth-child(2){width:10px;height:10px;background:linear-gradient(160deg,#fff,var(--blush));}
  .bubbles span:nth-child(3){width:5px;height:5px;}
  .bubbles span:nth-child(4){width:13px;height:13px;background:linear-gradient(160deg,#fff,var(--apricot));opacity:.5;}
  .bubbles span:nth-child(5){width:7px;height:7px;}

  /* ---------- Card ---------- */
  .card{
    background:var(--white);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(38,67,58,0.08);
    padding:26px 22px 24px;
  }
  .card-title{
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size:20px;
    color:var(--pine);
    margin:0 0 4px;
  }
  .card-desc{
    font-size:13px;color:var(--ink-soft);margin:0 0 20px;
    line-height:1.6;
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:13px;font-weight:700;color:var(--pine);
    margin-bottom:6px;
  }
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-left:4px;}
  input[type=text], input[type=tel], input[type=number], select{
    width:100%;
    padding:11px 13px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:var(--cream);
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, select:focus{
    border-color:var(--apricot);
    background:#fff;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .seg{
    display:flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;
  }
  .seg button{
    flex:1;padding:10px 8px;border:none;background:var(--cream);
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;transition:all .15s ease;
  }
  .seg button + button{border-left:1.5px solid var(--line);}
  .seg button.active{background:var(--pine);color:#fff;}

  .photo-upload{
    display:flex;align-items:center;gap:14px;
  }
  .photo-preview{
    width:64px;height:64px;border-radius:14px;
    background:var(--sage-light);
    border:1.5px dashed var(--sage);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;}
  .photo-preview svg{width:26px;height:26px;opacity:.55;}
  .upload-btn{
    padding:10px 16px;border-radius:11px;
    background:var(--cream);border:1.5px solid var(--line);
    font-size:13px;font-weight:600;color:var(--pine);cursor:pointer;
  }
  .upload-btn:hover{background:var(--sage-light);}
  input[type=file]{display:none;}

  /* ---------- Service cards ---------- */
  .svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .svc-card{
    border:1.5px solid var(--line);border-radius:14px;
    padding:16px 14px;cursor:pointer;
    background:var(--cream);
    transition:all .15s ease;
    text-align:left;
  }
  .svc-card:hover{border-color:var(--sage);}
  .svc-card.active{
    border-color:var(--apricot);background:#FFF6EA;
    box-shadow:0 0 0 3px rgba(228,148,61,0.15);
  }
  .svc-icon{font-size:22px;margin-bottom:6px;display:block;}
  .svc-name{font-weight:700;font-size:15px;color:var(--pine);}
  .svc-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  .choice-row{display:flex;gap:10px;margin-bottom:16px;}
  .choice-pill{
    flex:1;padding:12px;border-radius:12px;text-align:center;
    border:1.5px solid var(--line);background:var(--cream);
    font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  }
  .choice-pill.active{background:var(--pine);border-color:var(--pine);color:#fff;}

  .duration-box{
    background:var(--sage-light);
    border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;
    font-size:13.5px;color:var(--pine);font-weight:600;
    margin-top:6px;
  }
  .duration-box b{font-family:"Noto Serif TC",serif;font-size:16px;}

  /* ---------- Calendar ---------- */
  .cal-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-head .mo{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16px;color:var(--pine);}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{
    width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--cream);cursor:pointer;font-size:14px;color:var(--pine);
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:13.5px;font-weight:600;
    cursor:pointer;border:1.5px solid transparent;
    color:var(--ink);background:var(--cream);
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.disabled{
    color:#C9C0AC;background:#F1ECE0;cursor:not-allowed;
  }
  .cal-cell.avail:hover{border-color:var(--sage);}
  .cal-cell.selected{background:var(--apricot);color:#fff;}
  .cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--pine);}
  .cal-legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-soft);margin:6px 0 18px;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.a{background:var(--cream);border:1.5px solid var(--sage);}
  .dot.d{background:#F1ECE0;border:1.5px solid #C9C0AC;}

  .slot-title{font-size:13px;font-weight:700;color:var(--pine);margin:4px 0 10px;}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .slot{
    padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);
    background:var(--cream);text-align:center;font-size:13px;font-weight:600;
    color:var(--ink);cursor:pointer;
  }
  .slot:hover{border-color:var(--sage);}
  .slot.selected{background:var(--pine);border-color:var(--pine);color:#fff;}
  .slot.taken{
    background:#F1ECE0;color:#C9C0AC;cursor:not-allowed;
    text-decoration:line-through;
  }
  .empty-note{
    font-size:13px;color:var(--ink-soft);
    background:var(--cream);border-radius:10px;padding:14px;text-align:center;
  }

  /* ---------- Review ---------- */
  .review-block{
    background:var(--cream);border-radius:14px;padding:16px;margin-bottom:14px;
  }
  .review-block h4{
    margin:0 0 10px;font-size:12.5px;color:var(--apricot-dark);
    letter-spacing:1px;font-weight:700;
  }
  .review-line{
    display:flex;justify-content:space-between;gap:10px;
    padding:6px 0;font-size:13.5px;
    border-bottom:1px dashed var(--line);
  }
  .review-line:last-child{border-bottom:none;}
  .review-line .k{color:var(--ink-soft);flex-shrink:0;}
  .review-line .v{font-weight:600;text-align:right;}
  .review-photo{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .review-photo img{width:56px;height:56px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line);}

  /* ---------- Buttons ---------- */
  .actions{display:flex;gap:10px;margin-top:22px;}
  .btn{
    flex:1;padding:13px 18px;border-radius:12px;border:none;
    font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--apricot);color:#fff;}
  .btn-primary:hover{background:var(--apricot-dark);}
  .btn-primary:disabled{background:#E8D9C4;color:#fff;cursor:not-allowed;}
  .btn-ghost{background:var(--cream);color:var(--pine);border:1.5px solid var(--line);flex:0 0 100px;}
  .btn-ghost:hover{background:var(--sage-light);}
  .err{color:var(--danger);font-size:12px;margin-top:5px;}

  /* ---------- Success ---------- */
  .success{text-align:center;padding:10px 6px 4px;}
  .success .paw{
    width:64px;height:64px;border-radius:50%;background:var(--sage-light);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
  }
  .success h2{font-family:"Noto Serif TC",serif;color:var(--pine);margin:0 0 6px;}
  .success p{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}
  .conf-code{
    display:inline-block;background:var(--pine);color:#fff;
    padding:8px 18px;border-radius:10px;font-weight:700;letter-spacing:2px;
    font-family:"Noto Serif TC",serif;margin-bottom:22px;
  }

  @media (max-width:420px){
    .svc-grid{grid-template-columns:1fr;}
    .row2{grid-template-columns:1fr;}
    .slot-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="7" cy="8" r="2" fill="#F6F1E7"/>
        <circle cx="12" cy="6" r="2" fill="#F6F1E7"/>
        <circle cx="17" cy="8" r="2" fill="#F6F1E7"/>
        <path d="M12 11c-3 0-5.5 2.2-5.5 4.6 0 1.6 1.3 2.4 2.7 1.9.9-.3 1.7-.5 2.8-.5s1.9.2 2.8.5c1.4.5 2.7-.3 2.7-1.9C17.5 13.2 15 11 12 11z" fill="#F6F1E7"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">毛孩預約</div>
      <div class="brand-sub">寵物美容・洗澡・線上預約</div>
    </div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="bubbles"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="card" id="card"></div>
</div>

<script>
/* ---------------- state ---------------- */
const state = {
  step: 1,
  owner:{
    name:'', contactType:'phone', contactValue:'', address:'',
    petName:'', petBreed:'', petAge:'', petWeight:'', petPhoto:null
  },
  service:{ category:'', animalType:'', hairLength:'', duration:0, label:'' },
  booking:{ date:null, time:null }
};

const STEP_LABELS = ['基本資料','選擇服務','選擇時段','確認預約'];

/* mock availability: shop closed Mondays + a few fully-booked days */
function isClosedDay(date){
  return date.getDay() === 1; // Monday 公休
}
const FULLY_BOOKED = new Set(); // yyyy-mm-dd strings, filled lazily per month (mock)
function mockFullyBookedForMonth(year, month){
  // deterministic pseudo-random pick of 2 fully booked weekdays in the month (not already closed)
  const key = year+'-'+month;
  if(mockFullyBookedForMonth._done && mockFullyBookedForMonth._done.has(key)) return;
  mockFullyBookedForMonth._done = mockFullyBookedForMonth._done || new Set();
  mockFullyBookedForMonth._done.add(key);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let d=1; d<=daysInMonth && count<2; d++){
    const dt = new Date(year, month, d);
    if(isClosedDay(dt)) continue;
    if((d*7 + month) % 9 === 0){ // arbitrary deterministic pattern
      FULLY_BOOKED.add(fmtDate(dt));
      count++;
    }
  }
}

/* mock already-booked time ranges per date (minutes from midnight) */
const BOOKED_SLOTS = {}; // 'yyyy-mm-dd' -> [[start,end], ...]
function getBookedRanges(dateStr){
  if(BOOKED_SLOTS[dateStr]) return BOOKED_SLOTS[dateStr];
  // deterministic mock: derive 0-2 ranges from date string hash
  const hash = dateStr.split('-').reduce((a,c)=>a+parseInt(c,10),0);
  const ranges = [];
  if(hash % 3 === 0) ranges.push([9*60, 10*60+30]);
  if(hash % 4 === 0) ranges.push([11*60, 12*60]);
  BOOKED_SLOTS[dateStr] = ranges;
  return ranges;
}

function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtTime(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

/* calendar view state */
const calView = { year: new Date().getFullYear(), month: new Date().getMonth() };

/* ---------------- service durations ---------------- */
const SERVICE_DEF = {
  grooming: { name:'美容', icon:'✂️',
    rules:{
      cat:  { duration:120, label:'貓咪美容' },
      dogLong:{ duration:120, label:'長毛狗美容' },
      dogShort:{ duration:120, label:'短毛狗美容' }
    }
  },
  bath: { name:'洗澡', icon:'🛁',
    rules:{
      cat:  { duration:120, label:'貓咪洗澡' },
      dogLong:{ duration:90, label:'長毛狗洗澡' },
      dogShort:{ duration:60, label:'短毛狗洗澡' }
    }
  }
};

/* ---------------- render root ---------------- */
function render(){
  renderProgress();
  const card = document.getElementById('card');
  if(state.step===1) card.innerHTML = tplStep1();
  else if(state.step===2) card.innerHTML = tplStep2();
  else if(state.step===3) card.innerHTML = tplStep3();
  else if(state.step===4) card.innerHTML = tplStep4();
  else if(state.step===5) card.innerHTML = tplSuccess();

  if(state.step===1) bindStep1();
  if(state.step===2) bindStep2();
  if(state.step===3) bindStep3();
  if(state.step===4) bindStep4();
}

function renderProgress(){
  const el = document.getElementById('progress');
  el.innerHTML = STEP_LABELS.map((label,i)=>{
    const n = i+1;
    let cls='step-dot';
    if(n < state.step) cls+=' done clickable';
    else if(n === state.step) cls+=' active';
    return `<div class="${cls}" data-goto="${n}">
      <div class="step-num">${n < state.step ? '✓' : n}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.step-dot.clickable').forEach(d=>{
    d.addEventListener('click', ()=>{ state.step = parseInt(d.dataset.goto,10); render(); });
  });
}

/* ================= STEP 1 : 基本資料 ================= */
function tplStep1(){
  const o = state.owner;
  return `
    <h2 class="card-title">填寫飼主與毛孩資料</h2>
    <p class="card-desc">請提供您與毛孩的基本資訊，方便我們為毛孩準備最適合的服務。</p>

    <div class="field">
      <label>飼主姓名</label>
      <input type="text" id="f-name" placeholder="請輸入姓名" value="${esc(o.name)}">
    </div>

    <div class="field">
      <label>聯繫方式</label>
      <div class="seg" id="contact-seg">
        <button type="button" data-v="phone" class="${o.contactType==='phone'?'active':''}">電話</button>
        <button type="button" data-v="line" class="${o.contactType==='line'?'active':''}">LINE ID</button>
      </div>
    </div>
    <div class="field">
      <input type="text" id="f-contact" placeholder="${o.contactType==='phone'?'例如 0912-345-678':'請輸入 LINE ID'}" value="${esc(o.contactValue)}">
    </div>

    <div class="field">
      <label>地址</label>
      <input type="text" id="f-address" placeholder="請輸入地址" value="${esc(o.address)}">
    </div>

    <div class="field"><label style="margin-bottom:0;">— 毛孩資訊 —</label></div>

    <div class="row2">
      <div class="field">
        <label>寵物名稱</label>
        <input type="text" id="f-petname" placeholder="例如 麻糬" value="${esc(o.petName)}">
      </div>
      <div class="field">
        <label>寵物品種</label>
        <input type="text" id="f-petbreed" placeholder="例如 貴賓犬" value="${esc(o.petBreed)}">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>年齡 <span class="hint">(歲)</span></label>
        <input type="number" min="0" step="0.5" id="f-petage" placeholder="例如 2" value="${esc(o.petAge)}">
      </div>
      <div class="field">
        <label>體重 <span class="hint">(kg)</span></label>
        <input type="number" min="0" step="0.1" id="f-petweight" placeholder="例如 4.5" value="${esc(o.petWeight)}">
      </div>
    </div>

    <div class="field">
      <label>上傳寵物照片 <span class="hint">(選填)</span></label>
      <div class="photo-upload">
        <div class="photo-preview" id="photo-preview">
          ${o.petPhoto ? `<img src="${o.petPhoto}">` : svgPaw()}
        </div>
        <label class="upload-btn" for="f-photo">選擇照片</label>
        <input type="file" id="f-photo" accept="image/*">
      </div>
    </div>

    <div class="err" id="step1-err" style="display:none;"></div>

    <div class="actions">
      <button class="btn btn-primary" id="next1">下一步：選擇服務</button>
    </div>
  `;
}
function svgPaw(){

function computeDuration(){
  const s = state.service;
  if(!s.category || !s.animalType) return null;
  if(s.animalType==='cat') return SERVICE_DEF[s.category].rules.cat;
  if(s.animalType==='dog'){
    if(!s.hairLength) return null;
    return s.hairLength==='long' ? SERVICE_DEF[s.category].rules.dogLong : SERVICE_DEF[s.category].rules.dogShort;
  }
  return null;
}
function refreshDurationBox(){
  const box = document.getElementById('duration-slot');
  const r = computeDuration();
  if(r){
    state.service.duration = r.duration;
    state.service.label = r.label + '（' + SERVICE_DEF[state.service.category].name + '）';
    const hrs = r.duration/60;
    box.innerHTML = `<div class="duration-box"><span>預估所需時間</span><b>${hrs % 1 === 0 ? hrs : hrs.toFixed(1)} 小時</b></div>`;
  } else {
    state.service.duration = 0;
    box.innerHTML = '';
  }
}

}

/* ================= STEP 3 : 選擇日期時段 ================= */
function tplStep3(){
  mockFullyBookedForMonth(calView.year, calView.month);
  return `
    <h2 class="card-title">選擇預約日期與時段</h2>
    <p class="card-desc">營業時段為每日 09:00–13:00，灰色日期表示當日已無空檔。</p>

    <div class="cal-head">
      <button class="cal-nav" id="cal-prev" style="width:auto;padding:0 10px;">‹ 上個月</button>
      <div class="mo">${calView.year} 年 ${calView.month+1} 月</div>
      <button class="cal-nav" id="cal-next" style="width:auto;padding:0 10px;">下個月 ›</button>
    </div>

    <div class="cal-grid" id="cal-grid">${renderCalGrid()}</div>

    <div class="cal-legend">
      <span><i class="dot a"></i>可預約</span>
      <span><i class="dot d"></i>已無空檔／公休</span>
    </div>

    <div id="slot-section">${renderSlotSection()}</div>

    <div class="err" id="step3-err" style="display:none;"></div>

    <div class="actions">
      <button class="btn btn-ghost" id="back3">上一步</button>
      <button class="btn btn-primary" id="next3">下一步：確認預約</button>
    </div>
  `;
}
function renderCalGrid(){
  const {year, month} = calView;
  const first = new Date(year, month, 1);
  const startOffset = first.getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell empty"></div>`;

  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(year, month, d);
    const dateStr = fmtDate(dt);
    const isPast = dt < today;
    const closed = isClosedDay(dt);
    const fullyBooked = FULLY_BOOKED.has(dateStr);
    const disabled = isPast || closed || fullyBooked;
    const isToday = fmtDate(dt) === fmtDate(today);
    const isSelected = state.booking.date === dateStr;
    let cls = 'cal-cell';
    cls += disabled ? ' disabled' : ' avail';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    html += `<div class="${cls}" data-date="${disabled?'':dateStr}">${d}</div>`;
  }
  return html;
}
function renderSlotSection(){
  if(!state.booking.date){
    return `<div class="empty-note">請先選擇日期，即可查看可預約時段。</div>`;
  }
  const duration = state.service.duration || 120;
  const businessStart = 9*60, businessEnd = 13*60;
  const booked = getBookedRanges(state.booking.date);
  const slots = [];
  for(let start=businessStart; start+duration<=businessEnd; start+=30){
    const end = start+duration;
    const overlaps = booked.some(([bs,be]) => start < be && end > bs);
    slots.push({start, end, taken: overlaps});
  }
  if(slots.length===0){
    return `<div class="empty-note">此服務所需時間較長，當日時段不足，請選擇其他日期。</div>`;
  }
  return `
    <div class="slot-title">${state.booking.date} 可預約時段</div>
    <div class="slot-grid" id="slot-grid">
      ${slots.map(s=>{
        const val = fmtTime(s.start);
        const isSel = state.booking.time === val;
        let cls = 'slot';
        if(s.taken) cls += ' taken';
        else if(isSel) cls += ' selected';
        return `<div class="${cls}" data-time="${s.taken?'':val}">${val}</div>`;
      }).join('')}
    </div>
  `;
}
function bindStep3(){
  bindCalGrid();
  bindSlotGrid();
  document.getElementById('cal-prev').addEventListener('click', ()=>{
    calView.month--; if(calView.month<0){calView.month=11; calView.year--;}
    state.booking.date=null; state.booking.time=null;
    render();
  });
  document.getElementById('cal-next').addEventListener('click', ()=>{
    calView.month++; if(calView.month>11){calView.month=0; calView.year++;}
    state.booking.date=null; state.booking.time=null;
    render();
  });
  document.getElementById('back3').addEventListener('click', ()=>{ state.step=2; render(); });
  document.getElementById('next3').addEventListener('click', ()=>{
    const errEl = document.getElementById('step3-err');
    if(!state.booking.date || !state.booking.time){
      errEl.textContent = '請選擇預約日期與時段。';
      errEl.style.display='block';
      return;
    }
    errEl.style.display='none';
    state.step = 4;
    render();
  });
}
function bindCalGrid(){
  document.getElementById('cal-grid').addEventListener('click', e=>{
    const c = e.target.closest('.cal-cell.avail'); if(!c) return;
    state.booking.date = c.dataset.date;
    state.booking.time = null;
    document.getElementById('cal-grid').innerHTML = renderCalGrid();
    document.getElementById('slot-section').innerHTML = renderSlotSection();
    bindCalGrid();
    bindSlotGrid();
  });
}
function bindSlotGrid(){
  const grid = document.getElementById('slot-grid');
  if(!grid) return;
  grid.addEventListener('click', e=>{
    const s = e.target.closest('.slot'); if(!s || s.classList.contains('taken')) return;
    state.booking.time = s.dataset.time;
    document.getElementById('slot-section').innerHTML = renderSlotSection();
    bindSlotGrid();
  });
}

function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function bindStep4(){
  document.getElementById('back4').addEventListener('click', ()=>{ state.step=3; render(); });
  document.getElementById('submit4').addEventListener('click', ()=>{
    state.confirmCode = genCode();
    state.step = 5;
    render();
  });
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='PB-';
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
